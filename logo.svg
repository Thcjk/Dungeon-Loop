<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Dungeon Loop</title>
  <desc id="logoDesc">Dunkles Dungeon-Tor mit goldenem Loop-Emblem</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#d4a84b" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#8a5a20" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0a0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3f32"/>
      <stop offset="50%" stop-color="#2a241c"/>
      <stop offset="100%" stop-color="#16120e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="45%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#07060a"/>
    </linearGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="160" cy="150" rx="130" ry="120" fill="url(#glow)"/>

  <!-- Outer arch -->
  <path d="M48 300 V150
           C48 70 100 28 160 28
           C220 28 272 70 272 150
           V300 Z"
        fill="url(#stone)" stroke="#6a5638" stroke-width="4"/>

  <!-- Inner door void -->
  <path d="M78 292 V158
           C78 92 112 58 160 58
           C208 58 242 92 242 158
           V292 Z"
        fill="url(#door)" stroke="#3a3228" stroke-width="3"/>

  <!-- Keystone -->
  <path d="M146 28 L160 12 L174 28 L168 52 L152 52 Z" fill="url(#gold)" stroke="#8a6520" stroke-width="1.5"/>

  <!-- Loop emblem (infinite path) -->
  <g transform="translate(160 168)" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
    <path d="M-52 0
             C-52 -34 -28 -52 0 -28
             C28 -4 28 4 0 28
             C-28 52 -52 34 -52 0
             M52 0
             C52 34 28 52 0 28
             C-28 4 -28 -4 0 -28
             C28 -52 52 -34 52 0"/>
  </g>
  <circle cx="160" cy="168" r="9" fill="url(#gold)"/>

  <!-- Torch left -->
  <g transform="translate(92 210)">
    <rect x="-4" y="8" width="8" height="36" rx="2" fill="#3a2a18"/>
    <path d="M0 8 C-10 -6 -6 -22 0 -28 C6 -22 10 -6 0 8 Z" fill="#e67e22"/>
    <path d="M0 2 C-5 -6 -3 -16 0 -20 C3 -16 5 -6 0 2 Z" fill="#f1c40f"/>
  </g>
  <!-- Torch right -->
  <g transform="translate(228 210)">
    <rect x="-4" y="8" width="8" height="36" rx="2" fill="#3a2a18"/>
    <path d="M0 8 C-10 -6 -6 -22 0 -28 C6 -22 10 -6 0 8 Z" fill="#e67e22"/>
    <path d="M0 2 C-5 -6 -3 -16 0 -20 C3 -16 5 -6 0 2 Z" fill="#f1c40f"/>
  </g>

  <!-- Steps -->
  <rect x="70" y="292" width="180" height="12" fill="#2a241c" stroke="#6a5638" stroke-width="2"/>
  <rect x="58" y="304" width="204" height="14" fill="#1c1814" stroke="#6a5638" stroke-width="2"/>
</svg>
